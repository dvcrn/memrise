name: Publish

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2

      - name: Verify tag matches package version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be a stable semantic version such as 1.2.3"
            exit 1
          fi

          package_version="$(node --print "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun test index.test.ts

      # prepublishOnly runs the tsc build.
      - run: npm publish --access public
